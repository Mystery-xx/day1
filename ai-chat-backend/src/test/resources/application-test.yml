server:
  port: 8080

spring:
  application:
    name: ai-chat-test
  webflux:
    max-in-memory-size: 16MB
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ai:
  api:
    provider: test
    key: test-key
    url: http://test-api.example.com
    model: test-model
    temperature: 0.7
    max-tokens: 1024

logging:
  level:
    com.aichat: DEBUG
    org.springframework.web: INFO
