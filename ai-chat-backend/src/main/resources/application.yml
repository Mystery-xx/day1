server:
  port: 8082
  address: 0.0.0.0
  tomcat:
    async-request-timeout: 120000

spring:
  application:
    name: ai-chat
  webflux:
    max-in-memory-size: 16MB
  datasource:
    url: jdbc:h2:file:/data/chatdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ai:
  api:
    provider: ${AI_PROVIDER:gpustack}
    key: ${AI_API_KEY}
    url: ${AI_API_URL}
    gpustack-url: ${GPUSTACK_API_URL:}
    huggingface-url: ${HUGGINGFACE_API_URL:}
    huggingface-token: ${HUGGINGFACE_TOKEN:}
    model: ${AI_MODEL:}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:1024}
    top-p: ${AI_TOP_P:1.0}
    frequency-penalty: ${AI_FREQUENCY_PENALTY:0.0}
    presence-penalty: ${AI_PRESENCE_PENALTY:0.0}
    stop: ${AI_STOP:}
    history-limit: ${AI_HISTORY_LIMIT:10}

logging:
  level:
    com.aichat: DEBUG
    org.springframework.web: INFO

  ai:
    mcp:
      client:
        enabled: true
        name: ai-chat-mcp
        toolcallback:
          enabled: true

spring.main:
  allow-bean-definition-overriding: true
  web-application-type: servlet

spring.ai:
  retry:
    enabled: false
