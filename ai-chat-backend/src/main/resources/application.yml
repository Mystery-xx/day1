server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    async-request-timeout: 120000

spring:
  application:
    name: ai-chat
  webflux:
    max-in-memory-size: 16MB
  # Primary datasource (H2 - default for backward compatibility)
  datasource:
    url: jdbc:h2:file:/data/chatdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Additional datasources for multi-datasource support
datasources:
  # PostgreSQL for long-term memory
  postgresql:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aichat}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  # SQLite for working memory
  sqlite:
    url: jdbc:sqlite:./data/working.db
    driverClassName: org.sqlite.JDBC

ai:
  api:
    provider: ${AI_PROVIDER:gpustack}
    key: ${AI_API_KEY}
    url: ${AI_API_URL}
    gpustack-url: ${GPUSTACK_API_URL:}
    huggingface-url: ${HUGGINGFACE_API_URL:}
    huggingface-token: ${HUGGINGFACE_TOKEN:}
    model: ${AI_MODEL:default-chat}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:32768}
    top-p: ${AI_TOP_P:1.0}
    frequency-penalty: ${AI_FREQUENCY_PENALTY:0.0}
    presence-penalty: ${AI_PRESENCE_PENALTY:0.0}
    stop: ${AI_STOP:}
    history-limit: ${AI_HISTORY_LIMIT:10}

logging:
  level:
    com.aichat: DEBUG
    org.springframework.web: INFO

cache:
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=30m
