# Note: 'version' field is obsolete in modern Docker Compose, kept for compatibility
services:
  backend:
    build:
      context: ./ai-chat-backend
      dockerfile: Dockerfile
    container_name: ai-chat-backend
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_URL=${AI_API_URL}
      - AI_MODEL=${AI_MODEL}
      - AI_PROVIDER=${AI_PROVIDER:-gpustack}
      - GPUSTACK_API_URL=${GPUSTACK_API_URL:-}
      - HUGGINGFACE_API_URL=${HUGGINGFACE_API_URL:-}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Djava.io.flushonnewline=true
    ports:
      - "8082:8082"
    networks:
      - ai-chat-network
    volumes:
      - h2-data:/data
      - rag-index:/data/rag-index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./ai-chat-frontend
      dockerfile: Dockerfile
    container_name: ai-chat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ai-chat-network
    restart: unless-stopped

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: tei-reranker
    ports:
      - "8099:80"
    volumes:
      - ./models:/data
    command: --model-id BAAI/bge-reranker-v2-m3
    networks:
      - ai-chat-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 9G

networks:
  ai-chat-network:
    driver: bridge

volumes:
  h2-data:
  rag-index:
