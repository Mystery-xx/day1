# Rate limit zones
# chat_limit: 5 requests per minute for chat endpoint (cost control)
# mcp_limit: 10 requests per minute for MCP endpoints
# rag_limit: 2 requests per minute for RAG upload (expensive operations)
# api_limit: 30 requests per minute for general API
# conn_limit: connection limits per IP

limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Return 429 for rate limited requests
limit_req_status 429;

# DNS resolver for Docker service discovery
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name localhost;

    # Root directory for frontend static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Connection limits
    limit_conn conn_limit 20;

    # Security headers (applied to all responses)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chat endpoint - most restrictive (5r/m)
    location = /api/chat {
        limit_req zone=chat_limit burst=2 nodelay;
        limit_conn conn_limit 5;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # General API proxy with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # Pass through CORS headers from backend
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Max-Age;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # Chat streaming endpoint
    location /api/chat/stream {
        limit_req zone=chat_limit burst=5 nodelay;
        limit_conn conn_limit 10;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Streaming settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # MCP endpoints
    location /api/mcp/ {
        limit_req zone=mcp_limit burst=5 nodelay;
        limit_conn conn_limit 10;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # RAG upload - most restrictive (2r/m), 10MB body limit
    location /api/rag/upload {
        limit_req zone=rag_limit burst=1 nodelay;
        limit_conn conn_limit 3;

        client_max_body_size 10M;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # RAG search
    location /api/rag/search {
        limit_req zone=rag_limit burst=3 nodelay;
        limit_conn conn_limit 5;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check - rate limited (5r/m)
    location /api/chat/health {
        limit_req zone=chat_limit burst=4 nodelay;
        limit_conn conn_limit 5;

        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Block H2 console (Spring Boot)
    location /h2-console {
        return 403;
    }

    # Block sensitive actuator endpoints
    location ~ ^/actuator/(env|configprops|beans|conditions|threaddump|heapdump|logfile|loggers|metrics|prometheus|mappings) {
        return 403;
    }

    # Allow health and info actuator endpoints
    location ~ ^/actuator/(health|info) {
        set $backend_upstream http://backend:8082;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Block common exploits
    location ~ /\.htaccess { deny all; return 404; }
    location ~ /\.htpasswd { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location ~ /\.svn { deny all; return 404; }
    location ~ /\.env { deny all; return 404; }
}
